# CI for the standalone public zest_ssh_core repo.
# In the monorepo this file does nothing (Actions run from the repo root);
# it is here so it ships with the package copy that becomes the public repo.
name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
        continue-on-error: true

      - name: Analyze
        run: dart analyze

      - name: Run tests
        run: dart test
